<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statistics Practice Lab</title><style> *{box-sizing:border-box}body{margin:0;background:#f8f7ff;color:#22233d;font:17px system-ui;line-height:1.6}header{background:linear-gradient(120deg,#4338ca,#9333ea);color:white;padding:28px}h1,h2,h3{line-height:1.2}main{max-width:900px;margin:auto;padding:18px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}button{font:inherit;border:0;border-radius:12px;padding:10px 15px;cursor:pointer;background:#e9e5ff;color:#37308a}button:hover,button.active{background:#5145cd;color:white}section,.panel{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 15px #30206012;border-left:6px solid var(--accent,#6366f1)}.formula{background:#e9f9f4;padding:14px;border-radius:10px;font-size:1.15em;overflow-wrap:anywhere}.warn{background:#fff1ce;padding:12px;border-radius:10px}.choices button{display:block;width:100%;text-align:left;margin:8px 0}.good{background:#d1fae5!important;color:#065f46!important}.bad{background:#fee2e2!important;color:#991b1b!important}progress{width:100%;accent-color:#7c3aed}small{opacity:.8}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}input{font:inherit;padding:10px;width:100%;border:1px solid #aaa;border-radius:8px}a{color:#4338ca} .tag{display:inline-block;background:#fce7f3;color:#9d174d;padding:3px 10px;border-radius:20px} </style><header><small>EGN 3443 • EXAM II</small><h1>Statistics Practice Lab ✨</h1>Decode the words → choose the method → solve.</header><main><div id="stats"></div><nav id="nav"></nav><div id="content"></div></main><script>
const topics=[
['Start here','#6366f1','Read the last sentence first. Decide what is fixed: number of trials, target successes, population, or time interval.','Exactly k out of n → binomial; fixed finite group without replacement → hypergeometric; arrivals per hour → Poisson; until first success → geometric; until rth success → negative binomial.','PDF = exactly; CDF = at most. For integer counts: less than k = CDF(k−1); at least k = 1−CDF(k−1); more than k = 1−CDF(k).','Do not choose a distribution just because you see a percentage.'],
['Binomial','#2563eb','Fixed n independent trials, same probability p. Look for “out of”, “among the next”.','P(X=k) = C(n,k) p^k (1−p)^(n−k)','2nd → VARS → DISTR → binompdf(n,p,k) or binomcdf(n,p,k). Example: at least one of 15 with p=.2: 1−binomcdf(15,.2,0) = .9648.','At least includes the stated number.'],
['Hypergeometric','#059669','Select n distinct items from a finite population N containing M target items. No replacement.','P(X=k) = C(M,k) C(N−M,n−k) / C(N,n)','MATH → PRB → nCr. For 46 musicians, 20 women, 5 positions, less than 2 women: (20 nCr 0)(26 nCr 5)/(46 nCr 5) + (20 nCr 1)(26 nCr 4)/(46 nCr 5) ≈ .2661.','Do not confuse N (population) with n (sample).'],
['Poisson','#9333ea','Count events in a fixed interval at a constant average rate. Look for “per hour”, “next 30 minutes”.','μ = rate × duration; P(X=k) = exp(−μ) μ^k / k!','DISTR → poissonpdf(μ,k) or poissoncdf(μ,k). 3 per hour for 30 minutes: μ=3×.5=1.5; poissonpdf(1.5,2) ≈ .2510.','Convert time BEFORE entering the calculator. 15 minutes = .25 hours.'],
['Negative binomial','#ea580c','Independent trials with constant p; stop at the rth success.','P(N=n) = C(n−1,r−1) p^r (1−p)^(n−r); E(N)=r/p; E(failures)=r(1−p)/p','Use nCr by hand on TI-84. Third success on sixth trial: (5 nCr 2)(.2)^3(.8)^3 = .04096.','The final trial is fixed as a success. Recitation page 1 incorrectly places this under changing p; page 2 formula uses constant p.'],
['Geometric','#0d9488','Stop at the first success. Independent trials with constant p.','P(N=n)=(1−p)^(n−1)p; E(N)=1/p','DISTR → geometpdf(p,n) or geometcdf(p,n). First success on fourth trial with p=.3: .7³×.3=.1029.','Count total trials, not just failures.'],
['Hypothesis tests','#db2777','Historical mean μ₀, new sample mean, SD and sample size; asks for evidence. Increased → >; decreased → <; changed → ≠.','t=(x̄−μ₀)/(s/√n); z=(x̄−μ₀)/(σ/√n); df=n−1','STAT → TESTS → T-Test or Z-Test → Stats. Enter μ₀, x̄, SD, n, alternative. Reject H₀ if p-value ≤ α; otherwise fail to reject.','Use t when population SD is unknown, z when known (assuming test conditions). Recitation size-40 shortcut is not a general rule. The old exam repeats “increased” but its last worked answer uses two tails; use two tails only for a nondirectional claim.'],
['Confidence intervals','#0891b2','Look for “construct a 95% confidence interval for the true mean”.','CI = x̄ ± critical value × SE; SE = σ/√n or s/√n','STAT → TESTS → ZInterval or TInterval → Stats. Known σ: 90% z*=1.645; 95%=1.96; 99%=2.576. Salary example: 85000 ± 1.96(12000/√60) ≈ (81964,88036).','Interpret as confidence in the interval procedure, not a probability that a fixed mean moves into the interval.']];
const Q=[
[2,'2025 Exam II • Q1','There are five current openings to become a member of the brass section of the orchestra. Forty-six musicians show up for auditions. Twenty of the musicians are female. If musicians are randomly selected to join the orchestra, what is the probability that less than two of the selected musicians will be female?',['.2661','.2180','.0480','.7339'],0,'Less than two means zero or one.','Add hypergeometric probabilities for k=0 and k=1 using N=46, M=20, n=5.'],
[3,'2025 Exam II • Q2','Musicians arrive according to a Poisson process with an average of 3 musicians arriving each hour. What is the probability that two musicians will show up to audition in the next 30 minutes?',['.2240','.2510','.8088','.1494'],1,'Convert 30 minutes to hours.','μ=3×0.5=1.5. poissonpdf(1.5,2)=.2510.'],
[6,'2025 Exam II • Q3','A baseline study reported that 25% of orchestra members were women. A random sample of 20 orchestras has mean proportion .32 and sample SD .08. Test whether representation increased, assuming α=.05.',['Right-tailed t-test; reject H₀','Left-tailed t-test; reject H₀','Right-tailed t-test; fail to reject H₀','Two-tailed z-test; reject H₀'],0,'Look at the direction and type of SD.','H₀: μ=.25; Hₐ: μ>.25. t=3.913, df=19, p≈.000467. Reject H₀.'],
[1,'2025 Exam II • Q4','Assume that currently only 20% of all musicians who play brass instruments are female. If 15 musicians who play brass instruments are randomly selected for interviews, what is the probability that at least 1 of them is a female musician?',['.0352','.1319','.9648','.8329'],2,'Use the complement of at least one.','1−binomcdf(15,.2,0)=.9648.'],
[4,'2025 Exam II • Q5','Assume that currently 40% of all musicians who play woodwind instruments are male. How many woodwind musicians (whether male or female) would you expect to have to randomly select through the third female selection?',['2','5','7.5','3'],1,'Female is the target success.','p=.6, r=3; expected total trials r/p=5.'],
[6,'2025 Exam II • Q6 adapted','A random sample of 20 orchestras has mean proportion .32 and sample SD .08. Test whether the mean differs from the historical .25 at α=.05.',['One-tailed t; p=.000467','Two-tailed t; p≈.000934','Two-tailed z; p=.05','Left-tailed t; p≈.9995'],1,'Differs allows both directions.','t=3.913, df=19. Double the upper tail: 2×tcdf(3.913,1E99,19)≈.000934. Reject H₀. Wording adapted to match the recitation two-sided solution.'],
[7,'Recitation 9 • Q16','A university randomly samples 60 early-career women engineers and finds average annual salary $85,000 with true SD $12,000. Construct a 95% confidence interval for the true mean.',['($81964,$88036)','($83451,$86549)','($73000,$97000)','($82452,$87548)'],0,'Known population SD means use z.','SE=12000/√60=1549.19; ME=1.96×SE=3036.4.'],
[3,'Practice • rate conversion','A hospital receives 8 calls per hour. Exactly 3 in the next 15 minutes?',['poissonpdf(8,3)','poissonpdf(2,3)','poissoncdf(2,3)','poissonpdf(3,2)'],1,'15/60 hours.','μ=8×.25=2; PDF for exactly three.'],
[5,'Practice • first success','Independent inspections pass with probability .3. First pass on fourth trial?',['.2401','.1029','.7599','.3087'],1,'Three failures then one success.','geometpdf(.3,4)=.7³×.3=.1029.'],
[4,'Practice • third success','Independent trials have p=.2. Third success on sixth trial?',['.08192','.04096','.09888','.2'],1,'Reserve the last trial for success.','C(5,2)×.2³×.8³=.04096.'],
[1,'Practice • wording','For 10 independent trials with p=.2, which entry gives at least 3 successes?',['binomcdf(10,.2,3)','1−binomcdf(10,.2,3)','1−binomcdf(10,.2,2)','binompdf(10,.2,3)'],2,'The complement includes 0, 1, 2.','At least 3 includes 3, so subtract cumulative probability through 2.'],
[2,'Practice • identify','A box contains 12 devices, 5 defective. Four are selected without replacement. Exactly two defective: which setup?',['C(5,2)C(7,2)/C(12,4)','C(12,2)/C(12,4)','binompdf(4,5/12,2)','C(5,2)C(7,4)/C(12,4)'],0,'Select target and non-target items separately.','Two defective and two nondefective among four draws.'],
[6,'Practice • decision','A test gives p=.08 and α=.05. What is the decision?',['Reject H₀','Fail to reject H₀','Prove H₀ true','Change α to .10'],1,'Compare p to α.','The p-value exceeds α; insufficient evidence to reject H₀.'],
[7,'Practice • interval','Sample mean 80,000, n=100, known population SD 10,000. 95% confidence interval?',['78040–81960','79000–81000','78355–81645','77424–82576'],0,'SE is SD divided by square root of n.','SE=1000; ME=1.96×1000.']];
let topic=0, idx=0, locked=false, mode='topic', saved={};try{saved=JSON.parse(localStorage.getItem('statlab')||'{}')}catch(e){};const el=id=>document.getElementById(id);function stats(){let a=Object.values(saved);el('stats').innerHTML=`<small>Mastered ${a.filter(Boolean).length} / ${Q.length} questions • saved on this device</small><progress max="${Q.length}" value="${a.filter(Boolean).length}"></progress>`}function pool(){return Q.map((q,i)=>[q,i]).filter(([q])=>mode==='exam'?q[1].startsWith('2025'):mode==='all'||topic===0||q[0]===topic)}function select(t,m='topic'){topic=t;mode=m;idx=0;render()}function render(){stats();el('nav').innerHTML=topics.map((t,i)=>`<button class="${mode==='topic'&&topic===i?'active':''}" onclick="select(${i})">${t[0]}</button>`).join('')+`<button onclick="select(0,'exam')">2025 mock exam</button><button onclick="select(0,'all')">All practice</button>`;let t=topics[topic];el('content').innerHTML=(mode==='topic'?`<section style="--accent:${t[1]}"><span class="tag">Visual notes</span><h2>${t[0]}</h2><p>${t[2]}</p><div class="formula">${t[3]}</div><h3>TI-84 / worked example</h3><p>${t[4]}</p><div class="warn">⚠ ${t[5]}</div><button onclick="speak()">🔊 Read lesson aloud</button> <button onclick="speechSynthesis.cancel()">Stop audio</button></section>`:`<h2>${mode==='exam'?'2025 mock exam':'Mixed practice'}</h2>`)+`<section id="quiz"></section><section><h3>Sources & notes</h3>Recitation 8, Recitation 9, Fall 2025 Exam II. Some exam wording is shortened; Q6 is explicitly adapted to resolve the conflicting direction in the original. Additional practice is labeled.</section>`;show()}function speak(){if(!('speechSynthesis'in window)){alert('Audio unavailable in this browser');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(topics[topic].slice(2).join('. '));u.rate=.9;speechSynthesis.speak(u)}function show(){let p=pool();locked=false;let [q,id]=p[idx];el('quiz').innerHTML=`<small>${q[1]} • ${idx+1}/${p.length}</small><h3>${q[2]}</h3><div class="choices">${q[3].map((v,i)=>`<button onclick="answer(${i})">${'ABCD'[i]}. ${v}</button>`).join('')}</div><button onclick="el('hint').hidden=false">Hint</button><p id="hint" hidden>${q[5]}</p><div id="feedback" aria-live="polite"></div><nav><button onclick="idx=(idx+pool().length-1)%pool().length;show()">Previous</button><button onclick="show()">Retry</button><button onclick="idx=(idx+1)%pool().length;show()">Next</button></nav>`}function answer(i){if(locked)return;locked=true;let [q,id]=pool()[idx];let ok=i===q[4];saved[id]=ok||saved[id]||false;try{localStorage.setItem('statlab',JSON.stringify(saved))}catch(e){};let b=el('quiz').querySelectorAll('.choices button');b[q[4]].classList.add('good');if(!ok)b[i].classList.add('bad');el('feedback').innerHTML=`<p class="${ok?'good':'bad'}" style="padding:12px;border-radius:10px"><strong>${ok?'Correct!':'Not quite — try again.'}</strong><br>${q[6]}</p>`;stats()}render();</script></html>
